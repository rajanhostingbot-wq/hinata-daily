<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hinata Rewards 🌸</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; font-family:Arial,Helvetica,sans-serif;
      background:linear-gradient(145deg,#160d2b,#3b1459 52%,#17102d);
      color:#fff; display:flex; align-items:center; justify-content:center;
      padding:22px;
    }
    .card{
      width:100%; max-width:430px; text-align:center;
      padding:30px 22px 24px; border-radius:28px;
      background:rgba(255,255,255,.09);
      border:1px solid rgba(255,255,255,.14);
      box-shadow:0 18px 55px rgba(0,0,0,.35);
      backdrop-filter:blur(12px);
    }
    .logo{font-size:58px; margin-bottom:6px}
    h1{margin:0;font-size:28px;letter-spacing:.5px}
    .sub{color:#d9c9e8;margin:8px 0 25px;font-size:14px}
    .reward{
      background:rgba(255,255,255,.08); border-radius:20px;
      padding:18px; margin-bottom:20px;
    }
    .reward .money{font-size:34px;font-weight:800}
    .xp{margin-top:5px;color:#ffd76a;font-weight:700}
    button{
      width:100%; border:0; border-radius:16px; padding:16px;
      font-size:17px; font-weight:800; color:#24112e;
      background:linear-gradient(90deg,#ff9fdb,#ffd1ec);
      box-shadow:0 8px 25px rgba(255,159,219,.25);
      cursor:pointer;
    }
    button:disabled{opacity:.65}
    .status{min-height:24px;margin-top:15px;font-size:14px;color:#e7dced}
    .success{
      display:none; margin-top:18px; padding:15px; border-radius:16px;
      background:rgba(80,220,145,.12); color:#8ff0b5;
      border:1px solid rgba(143,240,181,.25); font-weight:700;
    }
    .footer{margin-top:22px;color:#a995b8;font-size:12px}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">🌸</div>
    <h1>HINATA DAILY REWARD</h1>
    <div class="sub">Verify yourself and claim your daily reward.</div>

    <section class="reward">
      <div class="money">$2000</div>
      <div class="xp">⭐ +50 XP</div>
    </section>

    <button id="claim">🌸 CLICK TO VERIFY</button>
    <div class="status" id="status">Your reward is waiting for you.</div>
    <div class="success" id="success">🎉 REWARD CLAIMED SUCCESSFULLY!</div>

    <div class="footer">HINATA • Daily Rewards</div>
  </main>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  const btn = document.getElementById("claim");
  const status = document.getElementById("status");
  const success = document.getElementById("success");

  btn.addEventListener("click", () => {
    btn.disabled = true;
    btn.textContent = "⏳ CLAIMING...";
    status.textContent = "Verifying your Telegram account...";

    setTimeout(() => {
      btn.textContent = "✅ SUCCESS!";
      status.textContent = "Your daily reward has been claimed.";
      success.style.display = "block";

      // Sends a small payload back to the bot when opened as a Telegram Web App.
      if (tg) {
        try {
          tg.sendData(JSON.stringify({
            action: "daily_claim",
            reward: 2000,
            xp: 50,
            timestamp: Date.now()
          }));
        } catch (e) {}
      }
    }, 1400);
  });
</script>
</body>
</html>
